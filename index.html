<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Gift of Theuth — An Interactive Reading of Plato's Phaedrus</title>

<!--
  ================================================================
  THE GIFT OF THEUTH
  An interactive adaptation of the Theuth & Thamus myth
  from Plato's Phaedrus (approx. 274c-275b), plus Socrates'
  reflections that follow (approx. 275d-276a).

  HOW THIS FILE IS ORGANIZED (read this first!):
    1. <style>   — how it LOOKS (colors, fonts, spacing)
    2. <body>    — the fixed page furniture (title, frame, buttons)
    3. THE STORY — one big JavaScript object called `scenes`.
                   THIS is what you edit to change the writing.
    4. THE ENGINE — the code that turns `scenes` into the game.
                   You can mostly leave this alone.

  TO EDIT THE WRITING: scroll down to "EDIT YOUR STORY HERE".
  Everything you'd want to change is below that line.

  NOTE ON SAVING: this is a plain web page with no server, so a
  student's typed answers live only in their browser tab and are
  lost if they close it. The "Compile" step on the final screen is
  how they preserve their work (print / save as PDF).
  ================================================================
-->

<style>
  /* ---- 1. THEME VARIABLES ----------------------------------- */
  :root {
    --ink:        #241d12;
    --ink-soft:   #4a3f2c;
    --parchment:  #f4ecd6;
    --panel:      #fbf6e7;
    --oxblood:    #7a2f22;
    --gold:       #8a6310;
    --rule:       #d9cba6;
    --focus:      #1b4d7a;
    --maxread:    44rem;
  }

  @import url('https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

  * { box-sizing: border-box; }
  html { font-size: 18px; }

  body {
    margin: 0;
    background-color: var(--parchment);
    background-image:
      radial-gradient(rgba(122, 47, 34, 0.04) 1px, transparent 1px),
      radial-gradient(rgba(36, 29, 18, 0.03) 1px, transparent 1px);
    background-size: 28px 28px, 36px 36px;
    background-position: 0 0, 14px 18px;
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
    line-height: 1.7;
    padding: 0 1.2rem 5rem;
  }

  .skip-link {
    position: absolute; left: -999px; top: 0;
    background: var(--ink); color: var(--parchment);
    padding: 0.6rem 1rem; z-index: 10;
  }
  .skip-link:focus { left: 0.5rem; top: 0.5rem; }

  /* ---- Masthead --------------------------------------------- */
  header.masthead {
    max-width: var(--maxread); margin: 0 auto;
    padding: 2.6rem 0 0.6rem; text-align: center;
  }
  .kicker {
    font-size: 0.82rem; letter-spacing: 0.34em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 0.4rem;
  }
  header.masthead h1 {
    font-family: 'Cormorant', serif; font-weight: 600;
    font-size: clamp(2.1rem, 6vw, 3.2rem); line-height: 1.05;
    color: var(--oxblood); margin: 0;
  }
  header.masthead .source {
    font-style: italic; color: var(--ink-soft);
    margin: 0.5rem 0 0; font-size: 1.02rem;
  }
  .meander { display: block; width: 180px; height: 16px; margin: 1rem auto 0; }

  .progress {
    max-width: var(--maxread); margin: 1.4rem auto 0;
    font-size: 0.82rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-soft); text-align: center;
  }
  .progress strong { color: var(--oxblood); font-weight: 600; }

  main { max-width: var(--maxread); margin: 1.5rem auto 0; }

  .scene {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 3px;
    padding: 2rem 2.2rem 2.3rem;
    box-shadow: 0 18px 40px -28px rgba(36, 29, 18, 0.5);
  }

  .speaker {
    font-family: 'Cormorant', serif; font-weight: 600; font-size: 0.95rem;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--oxblood);
    margin: 0 0 0.2rem;
  }
  .scene h2 {
    font-family: 'Cormorant', serif; font-weight: 600;
    font-size: clamp(1.6rem, 4.5vw, 2.1rem); line-height: 1.15;
    margin: 0.1rem 0 1.1rem; color: var(--ink);
  }
  .scene h2:focus { outline: none; }
  .scene h2:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

  .scene p { margin: 0 0 1.1rem; font-size: 1.12rem; }
  .scene p:last-of-type { margin-bottom: 0; }
  .scene .aside {
    border-left: 3px solid var(--gold); padding-left: 1rem;
    font-style: italic; color: var(--ink-soft);
  }

  /* ---- Optional prompt blocks (textareas) ------------------- */
  .prompt {
    background: var(--parchment); border: 1px solid var(--rule);
    border-left: 4px solid var(--gold); border-radius: 2px;
    padding: 1rem 1.1rem; margin: 1.4rem 0 0;
  }
  .prompt label {
    display: block; font-style: italic; color: var(--ink-soft);
    margin-bottom: 0.5rem; font-size: 1.02rem;
  }
  .prompt textarea {
    width: 100%; min-height: 4.6rem; resize: vertical;
    font-family: 'EB Garamond', serif; font-size: 1.05rem; line-height: 1.5;
    color: var(--ink); background: var(--panel);
    border: 1px solid var(--rule); border-radius: 2px; padding: 0.6rem 0.7rem;
  }
  .prompt textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .prompt .optional { font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); }

  /* Read-only note shown when reviewing a past scene */
  .saved-note {
    background: var(--parchment); border: 1px dashed var(--rule);
    border-radius: 2px; padding: 0.8rem 1rem; margin: 1.2rem 0 0; font-style: italic;
  }
  .saved-note .saved-label { display:block; font-style:normal; font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); margin-bottom:0.3rem; }

  /* ---- Choice buttons --------------------------------------- */
  .choices { list-style: none; margin: 1.8rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 0.7rem; }
  .choice-btn {
    display: block; width: 100%; text-align: left;
    font-family: 'EB Garamond', serif; font-size: 1.08rem; line-height: 1.45;
    color: var(--ink); background: var(--parchment);
    border: 1px solid var(--rule); border-left: 4px solid var(--oxblood); border-radius: 2px;
    padding: 0.85rem 1rem; min-height: 44px; cursor: pointer;
    transition: background-color 0.18s ease;
  }
  .choice-btn:hover { background: #efe4c6; }
  .choice-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .choice-btn .marker { color: var(--oxblood); font-weight: 600; margin-right: 0.5rem; }

  /* ---- Reflection: path summary (now clickable) ------------- */
  .path-summary {
    background: var(--parchment); border: 1px dashed var(--rule); border-radius: 3px;
    padding: 1rem 1.2rem; margin: 1.6rem 0 0; font-size: 1rem; color: var(--ink-soft);
  }
  .path-summary .ps-label { display:block; color: var(--oxblood); font-weight: 600; margin-bottom: 0.4rem; }
  .path-link {
    font-family: 'EB Garamond', serif; font-size: 1rem;
    background: none; border: none; padding: 0; cursor: pointer;
    color: var(--oxblood); text-decoration: underline; text-underline-offset: 2px;
  }
  .path-link:hover { color: var(--gold); }
  .path-link:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .path-arrow { color: var(--ink-soft); margin: 0 0.35rem; }

  /* ---- Primary action buttons (compile / print / back) ------ */
  .action-btn {
    font-family: 'Cormorant', serif; font-size: 1rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--parchment); background: var(--oxblood);
    border: 1px solid var(--oxblood); border-radius: 2px;
    padding: 0.7rem 1.3rem; min-height: 44px; cursor: pointer; margin: 1.6rem 0.5rem 0 0;
  }
  .action-btn:hover { background: #621f15; }
  .action-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .action-btn.secondary { color: var(--ink-soft); background: transparent; border-color: var(--rule); }
  .action-btn.secondary:hover { color: var(--oxblood); border-color: var(--oxblood); }

  /* ---- The compiled reflection document --------------------- */
  #export-doc { display: none; }
  #export-doc.ready { display: block; margin: 1.8rem 0 0; }
  .export-inner {
    background: #fffdf6; border: 1px solid var(--rule); border-radius: 3px;
    padding: 2rem 2.2rem; box-shadow: 0 14px 36px -28px rgba(36,29,18,0.5);
  }
  .export-inner h3 {
    font-family: 'Cormorant', serif; font-weight: 600; color: var(--oxblood);
    font-size: 1.6rem; margin: 0 0 0.2rem;
  }
  .export-meta { font-size: 0.9rem; color: var(--ink-soft); margin: 0 0 1.4rem; font-style: italic; }
  .export-inner p { font-size: 1.1rem; margin: 0 0 1.1rem; }

  /* ---- Restart + colophon ----------------------------------- */
  .controls { max-width: var(--maxread); margin: 1.4rem auto 0; text-align: center; }
  .restart-btn {
    font-family: 'Cormorant', serif; font-size: 0.9rem; letter-spacing: 0.16em;
    text-transform: uppercase; background: transparent; color: var(--ink-soft);
    border: 1px solid var(--rule); border-radius: 2px; padding: 0.55rem 1.1rem;
    min-height: 44px; cursor: pointer;
  }
  .restart-btn:hover { color: var(--oxblood); border-color: var(--oxblood); }
  .restart-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  footer.colophon {
    max-width: var(--maxread); margin: 3rem auto 0; text-align: center;
    font-size: 0.85rem; font-style: italic; color: var(--ink-soft);
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* ---- Print: show ONLY the compiled document --------------- */
  @media print {
    body { background: #fff; padding: 0; }
    body * { visibility: hidden; }
    #export-doc, #export-doc * { visibility: visible; }
    #export-doc { position: absolute; left: 0; top: 0; width: 100%; }
    .export-inner { border: none; box-shadow: none; padding: 0; }
    .print-hide { display: none !important; }
  }
</style>
</head>

<body>
  <a class="skip-link" href="#scene-region">Skip to the story</a>

  <header class="masthead">
    <p class="kicker">An Interactive Reading</p>
    <h1>The Gift of Theuth</h1>
    <p class="source">From Plato&rsquo;s <em>Phaedrus</em> &middot; the myth of writing&rsquo;s invention</p>
    <svg class="meander" viewBox="0 0 180 16" aria-hidden="true" focusable="false">
      <path d="M2 14 V4 H14 V12 H10 V8 H6 M22 14 V4 H34 V12 H30 V8 H26
               M42 14 V4 H54 V12 H50 V8 H46 M62 14 V4 H74 V12 H70 V8 H66
               M82 14 V4 H94 V12 H90 V8 H86 M102 14 V4 H114 V12 H110 V8 H106
               M122 14 V4 H134 V12 H130 V8 H126 M142 14 V4 H154 V12 H150 V8 H146
               M162 14 V4 H174 V12 H170 V8 H166"
            fill="none" stroke="#7a2f22" stroke-width="1.6"/>
    </svg>
  </header>

  <p class="progress" id="progress">Scene <strong><span id="progress-num">1</span></strong></p>

  <main>
    <section class="scene" id="scene-region" aria-live="polite" aria-atomic="true">
      <!-- JavaScript fills this in -->
    </section>
  </main>

  <div class="controls">
    <button type="button" class="restart-btn" id="restart">Begin again</button>
  </div>

  <footer class="colophon">
    A teaching demonstration &middot; text adapted from a public-domain translation
  </footer>

<script>
/* ================================================================
   3. THE STORY  —  *** EDIT YOUR STORY HERE ***
   ----------------------------------------------------------------
   Each scene may have:
     speaker  : (optional) name shown above the heading
     title    : the scene's heading
     body     : array of paragraphs
     aside    : (optional) italic side-note
     prompts  : (optional) array of { id, label } optional text inputs.
                The `id` is also used to weave the answer into the
                final compiled reflection (see buildExport, below).
     choices  : (optional) array of { label, to }  (omit on the ending)
     ending   : (optional) true on the final reflection scene
   ================================================================ */

  const scenes = {

    /* ---- The frame ----------------------------------------- */
    start: {
      speaker: "Socrates",
      title: "A Story from the Old Days",
      body: [
        "Phaedrus, I can tell you something I heard from the ancients of Egypt \u2014 though whether it is true, only they themselves knew.",
        "It concerns the very invention you and I are leaning on at this moment: the written word. Shall I tell it?"
      ],
      choices: [
        { label: "Please, tell the story.", to: "court" },
        { label: "First \u2014 why a story, and not a plain argument?", to: "why_story" }
      ]
    },

    why_story: {
      speaker: "Socrates",
      title: "Why a Story",
      body: [
        "Because a tale can carry what a bare argument leaves out. It lets us watch an idea being weighed, rather than simply handing us a verdict.",
        "But do not take it on trust. Listen, and judge the matter for yourself."
      ],
      choices: [ { label: "Very well \u2014 begin.", to: "court" } ]
    },

    /* ---- The court at Thebes ------------------------------- */
    court: {
      speaker: "The Tale",
      title: "At the Court of King Thamus",
      body: [
        "In Egypt, near the city of Naucratis, there lived an old god named Theuth \u2014 the same to whom we owe number and calculation, geometry and astronomy, the games of draughts and dice, and, above all, letters: the art of writing.",
        "Theuth came before Thamus, who was king over all Egypt, and displayed his arts one by one, urging that each be passed along to the Egyptian people. The king questioned him closely about every art, praising what seemed good to him and faulting what seemed ill.",
        "Before we come to the gift that troubled the king most, which of the god\u2019s other inventions will you look into?"
      ],
      choices: [
        { label: "Number and calculation", to: "inv_number" },
        { label: "Geometry and astronomy", to: "inv_geometry" },
        { label: "The games of draughts and dice", to: "inv_games" },
        { label: "The letters \u2014 the art of writing", to: "pitch" }
      ]
    },

    inv_number: {
      speaker: "The Tale",
      title: "Number and Calculation",
      body: [
        "With number and calculation, Theuth explained, the Egyptians could count their herds and seasons, divide their fields, and keep their accounts \u2014 the very sinews that hold an ordered kingdom together.",
        "The king heard him out and weighed the art, then turned his mind back toward the gift still waiting to be shown."
      ],
      aside: "Theuth has not yet presented his proudest invention.",
      choices: [ { label: "Return to the king\u2019s court", to: "court" } ]
    },
    inv_geometry: {
      speaker: "The Tale",
      title: "Geometry and Astronomy",
      body: [
        "With geometry, Theuth went on, the land itself could be measured and restored after each year\u2019s flooding of the Nile; with astronomy, the heavens could be read for the turning of the seasons and the timing of the harvest.",
        "Useful arts, the king allowed \u2014 yet his attention kept drifting toward the last of the god\u2019s gifts."
      ],
      aside: "Theuth has not yet presented his proudest invention.",
      choices: [ { label: "Return to the king\u2019s court", to: "court" } ]
    },
    inv_games: {
      speaker: "The Tale",
      title: "Draughts and Dice",
      body: [
        "Even the games of draughts and dice, Theuth claimed, had their worth, schooling the player in foresight and patience and in the play of chance against skill.",
        "The king nodded \u2014 but it was the final invention he was truly waiting to weigh."
      ],
      aside: "Theuth has not yet presented his proudest invention.",
      choices: [ { label: "Return to the king\u2019s court", to: "court" } ]
    },

    /* ---- Theuth's pitch ------------------------------------ */
    pitch: {
      speaker: "Theuth",
      title: "The Pitch for Writing",
      body: [
        "At last Theuth set before the king his proudest invention. \u201CThis art of letters, O King, is a kind of writing-down of speech \u2014 a way to fix in lasting marks what until now has lived only in the breath of the speaker and the memory of the hearer.",
        "Once set down, words need no longer vanish the instant they are spoken. They can be carried across distances their author never travels, and kept long after the voice that shaped them has fallen silent.",
        "For this reason, O King, this invention will make the Egyptians wiser and improve their memory. I have discovered a remedy for both memory and wisdom.\u201D"
      ],
      prompts: [
        { id: "remedy_today",
          label: "Before you answer for Theuth: what tool in your own world is offered today as a \u201Cremedy\u201D for memory or for wisdom? Name one." }
      ],
      choices: [
        { label: "Press the gift to MEMORY \u2014 it will help us remember.", to: "rebut_memory" },
        { label: "Press the gift to WISDOM \u2014 it will make us wise.", to: "rebut_wisdom" }
      ]
    },

    rebut_memory: {
      speaker: "King Thamus",
      title: "On Memory",
      body: [
        "\u201CYou, who are the father of letters, have from fondness for your own child credited it with the very opposite of its real power.",
        "For this invention will breed forgetfulness in the souls of those who learn it. Trusting to what is written, they will cease to exercise their memory from within, and will call things to mind from the outside, by marks that are not their own.",
        "You have discovered a recipe not for memory, but for reminding.\u201D"
      ],
      choices: [
        { label: "And what does the king say of WISDOM?", to: "rebut_wisdom" },
        { label: "I have heard enough of Theuth and Thamus.", to: "extension" }
      ]
    },

    rebut_wisdom: {
      speaker: "King Thamus",
      title: "On Wisdom",
      body: [
        "\u201CAnd to your students you give not truth, but only its semblance. Hearing many things without being truly taught, they will seem to know much while knowing nothing at all.",
        "They will be tiresome company \u2014 wearing the appearance of wisdom in place of the thing itself.\u201D"
      ],
      choices: [
        { label: "And what does the king say of MEMORY?", to: "rebut_memory" },
        { label: "I have heard enough of Theuth and Thamus.", to: "extension" }
      ]
    },

    /* ---- Socrates extends the worry ------------------------ */
    extension: {
      speaker: "Socrates",
      title: "What Socrates Adds",
      body: [
        "So spoke the king, Phaedrus. And to his judgment I would add a worry of my own \u2014 for the written word, I think, shares a strange quality with painting.",
        "Each of the troubles I have in mind reveals something the king only began to name. Which shall we examine?"
      ],
      choices: [
        { label: "That, like a painting, it stays silent when questioned", to: "ext_silent" },
        { label: "That it cannot choose who reads it", to: "ext_readers" },
        { label: "That it cannot defend itself", to: "ext_defend" },
        { label: "Enough \u2014 let us reflect on all of this", to: "reflection" }
      ]
    },

    ext_silent: {
      speaker: "Socrates",
      title: "The Silence of Writing",
      body: [
        "\u201CThe painter\u2019s figures stand before you as though alive; yet ask them a question, and they keep a solemn silence.",
        "Written words are no different. They seem to speak as if they understood, but question them, wishing to learn, and they go on telling you one and the same thing, forever.\u201D"
      ],
      prompts: [
        { id: "metaphor_silent",
          label: "Socrates likens writing to silent painted figures. What is a different metaphor you might use for this one-way quality of written text?" }
      ],
      choices: [ { label: "Return to the other troubles", to: "extension" } ]
    },
    ext_readers: {
      speaker: "Socrates",
      title: "Writing Cannot Choose Its Readers",
      body: [
        "\u201CAnd once a thing is set down in writing, it drifts everywhere alike \u2014 into the hands of those who understand it and of those who have no business with it.",
        "It does not know to whom it should speak, and before whom it should keep silent.\u201D"
      ],
      prompts: [
        { id: "metaphor_readers",
          label: "How would you picture a text that cannot choose its readers? Offer your own image or example." }
      ],
      choices: [ { label: "Return to the other troubles", to: "extension" } ]
    },
    ext_defend: {
      speaker: "Socrates",
      title: "Writing Cannot Defend Itself",
      body: [
        "\u201CAnd if a piece of writing is mistreated or unfairly attacked, it cannot answer back. It always needs its parent to come to its aid,",
        "for it has no power to protect or defend itself.\u201D"
      ],
      prompts: [
        { id: "metaphor_defend",
          label: "What is your own way of describing a text that cannot defend itself?" }
      ],
      choices: [ { label: "Return to the other troubles", to: "extension" } ]
    },

    /* ---- The reflective close (ending) -------------------- */
    reflection: {
      title: "Reflection",
      ending: true,
      body: [
        "You have just navigated an ancient warning about writing \u2014 by means of a writing technology newer than any Thamus or Socrates could have imagined.",
        "Notice what the old king feared. Not that writing was useless, but that it would quietly trade one good for another: memory held within for memory stored without, the reality of understanding for its convincing likeness. These are not the worries of a single distant age. They return, in new dress, with every technology that offers to remember or to think on our behalf.",
        "Take a moment with the questions below. Your answers stay only in this browser tab \u2014 so when you are ready, use \u201CCompile my reflection\u201D to gather them into a single page you can print or save as a PDF."
      ],
      prompts: [
        { id: "q_form",
          label: "What did this interactive form let you do that simply reading the passage would not \u2014 and what did it cost?" },
        { id: "q_memory",
          label: "Thamus distinguishes a tool for memory from a tool for mere reminding. Where do you see that distinction in the technologies you use now?" },
        { id: "q_medium",
          label: "If you adapted a passage of the Phaedrus yourself, which medium would reveal something the written text hides \u2014 and which would hide something it reveals?" }
      ]
      /* no `choices` here: the ending screen builds its own controls */
    }

  };
  /* ================= END OF EDITABLE STORY ===================== */


/* ================================================================
   4. THE ENGINE  (you can usually leave this part alone)
   ================================================================ */

  const region   = document.getElementById("scene-region");
  const progNum  = document.getElementById("progress-num");
  const restart  = document.getElementById("restart");

  let stepCount  = 0;     // moves made (gentle progress counter)
  const path     = [];    // [{id, title}] of meaningful scenes visited
  const responses = {};   // every typed answer, keyed by prompt id

  // Small helper: escape user text before placing it in HTML.
  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* go(): forward navigation. Updates the counter + path, then draws. */
  function go(id) {
    stepCount += 1;
    progNum.textContent = stepCount;
    const sc = scenes[id];
    const skip = id.startsWith("inv_") || id === "why_story" || id === "reflection";
    if (!skip && !path.some(function (p) { return p.id === id; })) {
      path.push({ id: id, title: sc.title });
    }
    draw(id, false);
  }

  /* review(): read-only look at a past scene; no state changes. */
  function review(id) { draw(id, true); }

  /* draw(): render a scene. `reviewing` = true for read-only review. */
  function draw(id, reviewing) {
    const scene = scenes[id];
    if (!scene) { return; }

    let html = "";
    if (scene.speaker) html += '<p class="speaker">' + scene.speaker + "</p>";
    html += '<h2 tabindex="-1">' + scene.title + "</h2>";
    scene.body.forEach(function (para) { html += "<p>" + para + "</p>"; });
    if (scene.aside) html += '<p class="aside">' + scene.aside + "</p>";

    if (reviewing) {
      // Show any saved answers read-only, then a single way back.
      if (scene.prompts) {
        scene.prompts.forEach(function (pr) {
          const val = responses[pr.id];
          if (val && val.trim()) {
            html += '<div class="saved-note"><span class="saved-label">Your note</span>'
                  + esc(val) + "</div>";
          }
        });
      }
      html += '<button type="button" class="action-btn secondary" data-back="1">'
            + "Return to your reflection</button>";
      region.innerHTML = html;
      region.querySelector("h2").focus();
      region.querySelector("[data-back]").addEventListener("click", function () {
        draw("reflection", false);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      return;
    }

    // Editable prompts (optional inputs).
    if (scene.prompts) {
      scene.prompts.forEach(function (pr) {
        const val = responses[pr.id] ? esc(responses[pr.id]) : "";
        html += '<div class="prompt print-hide">'
              + '<label for="ta-' + pr.id + '">' + pr.label
              + ' <span class="optional">(optional)</span></label>'
              + '<textarea id="ta-' + pr.id + '" data-pid="' + pr.id
              + '">' + val + "</textarea></div>";
      });
    }

    if (scene.ending) {
      // Path summary, each stop clickable for review.
      html += '<div class="path-summary print-hide"><span class="ps-label">The path you took '
            + "(click any stop to revisit it):</span>";
      path.forEach(function (p, i) {
        if (i > 0) html += '<span class="path-arrow" aria-hidden="true">\u2192</span>';
        html += '<button type="button" class="path-link" data-review="' + p.id + '">'
              + p.title + "</button>";
      });
      html += "</div>";

      html += '<div class="print-hide">'
            + '<button type="button" class="action-btn" id="compile-btn">Compile my reflection</button>'
            + "</div>";

      // Container the compiled document drops into (also the print target).
      html += '<section id="export-doc" aria-label="Your compiled reflection"></section>';
    }

    if (scene.choices) {
      html += '<ul class="choices">';
      scene.choices.forEach(function (choice) {
        html += '<li><button type="button" class="choice-btn" data-to="' + choice.to
              + '"><span class="marker" aria-hidden="true">&#8250;</span>' + choice.label
              + "</button></li>";
      });
      html += "</ul>";
    }

    region.innerHTML = html;
    region.querySelector("h2").focus();

    // Save typed answers as they go.
    region.querySelectorAll("textarea[data-pid]").forEach(function (ta) {
      ta.addEventListener("input", function () {
        responses[ta.getAttribute("data-pid")] = ta.value;
      });
    });

    // Wire forward choices.
    region.querySelectorAll(".choice-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        go(btn.getAttribute("data-to"));
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    // Wire path-review links + compile button on the ending screen.
    if (scene.ending) {
      region.querySelectorAll(".path-link").forEach(function (lnk) {
        lnk.addEventListener("click", function () {
          review(lnk.getAttribute("data-review"));
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
      region.querySelector("#compile-btn").addEventListener("click", buildExport);
    }
  }

  /* ----------------------------------------------------------------
     buildExport(): weave the student's answers into first-person
     generated scaffolding, seamlessly (no visual distinction), and
     reveal it on screen + make it the print target.

     To adjust the generated wording, edit the `frag()` calls below.
     `frag(answerId, withText, fallback)` returns a sentence that uses
     the student's words if present, or a graceful first-person filler.
  ---------------------------------------------------------------- */
  function buildExport() {
    function clean(id) {
      const v = responses[id];
      return v && v.trim() ? v.trim() : "";
    }
    // Returns the student's text, or a soft first-person fallback.
    function answer(id, fallback) {
      const v = clean(id);
      return v ? v : fallback;
    }

    const p1 =
      "Reading the myth of Theuth and Thamus, I was struck by how familiar the old king\u2019s "
      + "worries felt. Theuth offered writing as a remedy for memory and for wisdom, and it is "
      + "not hard to find the same promise around me today: " + answer("remedy_today",
        "a tool that offers to remember or to understand on my behalf")
      + ". Like the Egyptians weighing the god\u2019s gift, I had to ask what such a remedy quietly "
      + "takes in return for what it gives.";

    const p2 =
      "Socrates worried that writing, like a painting, falls silent the moment we question it. "
      + "While he offers the metaphor of silent painted figures to capture this one-way quality of "
      + "written text, one alternative metaphor I would offer is " + answer("metaphor_silent",
        "one I am still searching for")
      + ". He worried, too, that writing cannot choose its readers, drifting toward anyone at all; "
      + "here I might instead picture it as " + answer("metaphor_readers",
        "something I have yet to put into an image of my own")
      + ". And where he saw a text unable to defend itself, leaning always on its parent for help, "
      + "I would describe that helplessness as " + answer("metaphor_defend",
        "a vulnerability I am still trying to name") + ".";

    const p3 =
      "This adaptation asked me to move through the argument rather than simply read it. What that "
      + "interactive form gave me, and what it cost, I would put this way: " + answer("q_form",
        "something I am still working out") + ".";

    const p4 =
      "Thamus separates a tool that strengthens memory from one that merely reminds. When I look at "
      + "the technologies I rely on, that distinction shows up like this: " + answer("q_memory",
        "a line I am still learning to draw") + ".";

    const p5 =
      "Finally, thinking ahead to adapting a passage myself, I weighed which medium might reveal what "
      + "the written text conceals, and which might conceal what it reveals: " + answer("q_medium",
        "a choice I have not yet made") + ".";

    const p6 =
      "Set down here, my own words now sit among sentences I did not write \u2014 which is, perhaps, "
      + "exactly the predicament that Thamus described.";

    const pathLine = path.map(function (p) { return p.title; }).join(" \u2192 ");
    const today = new Date().toLocaleDateString(undefined,
      { year: "numeric", month: "long", day: "numeric" });

    const docHtml =
      '<div class="export-inner">'
      + '<h3>Reflection on \u201CThe Gift of Theuth\u201D</h3>'
      + '<p class="export-meta">A compiled reflection &middot; ' + today
      + "<br>Path through the reading: " + esc(pathLine) + "</p>"
      + "<p>" + esc(p1) + "</p>"
      + "<p>" + esc(p2) + "</p>"
      + "<p>" + esc(p3) + "</p>"
      + "<p>" + esc(p4) + "</p>"
      + "<p>" + esc(p5) + "</p>"
      + "<p>" + esc(p6) + "</p>"
      + '<div class="print-hide">'
      + '<button type="button" class="action-btn" id="print-btn">Print / Save as PDF</button>'
      + '<button type="button" class="action-btn secondary" id="recompile-btn">Update after editing</button>'
      + "</div>"
      + "</div>";

    const exportDoc = document.getElementById("export-doc");
    exportDoc.innerHTML = docHtml;
    exportDoc.classList.add("ready");

    document.getElementById("print-btn").addEventListener("click", function () {
      window.print();
    });
    document.getElementById("recompile-btn").addEventListener("click", buildExport);

    exportDoc.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* The "Begin again" button: replays the journey but KEEPS typed text. */
  restart.addEventListener("click", function () {
    stepCount = 0;
    path.length = 0;
    go("start");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // Start.
  go("start");

</script>
</body>
</html>
